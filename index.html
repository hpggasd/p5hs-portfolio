<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 작품 포트폴리오</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 36px 20px;
      background:
        radial-gradient(circle at top left, rgba(255, 190, 180, 0.45), transparent 30%),
        radial-gradient(circle at bottom right, rgba(140, 190, 255, 0.4), transparent 35%),
        #f7f1e8;
      font-family: Arial, sans-serif;
      color: #26304d;
    }

    header {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto 24px auto;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .intro {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #5d6478;
    }

    #projects {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 28px rgba(50, 55, 80, 0.16);
      backdrop-filter: blur(10px);
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      font-weight: bold;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: #26304d;
      color: white;
      font-size: 0.72rem;
      font-weight: normal;
    }

    .preview {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #ffffff;
    }

    .preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 600px;
      height: 400px;
      border: none;
      transform-origin: top left;
      background: white;
    }

    footer {
      max-width: 1120px;
      margin: 24px auto 0 auto;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.55);
      color: #5d6478;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 760px) {
      body {
        padding: 24px 12px;
      }

      h1 {
        font-size: 1.5rem;
      }

      #projects {
        gap: 12px;
      }

      .card-title {
        padding: 9px 10px;
        font-size: 0.78rem;
      }

      .tag {
        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>나의 p5.js 작품 포트폴리오</h1>
    <p class="intro">
      과제 1부터 과제 4까지의 p5.js 작품을 2행 2열 구조로 배치했습니다.<br />
      정적 작품과 동적 작품이 한 화면에서 바로 보이도록 구성했습니다.
    </p>
  </header>

  <main id="projects">
    <!-- 1행 왼쪽: 과제 1 -->
    <section class="card">
      <div class="card-title">
        <span>과제 1 | 추상화</span>
        <span class="tag">Static</span>
      </div>
      <div class="preview">
        <iframe src="project1/index.html"></iframe>
      </div>
    </section>

    <!-- 1행 오른쪽: 과제 4 -->
    <section class="card">
      <div class="card-title">
        <span>과제 4 | 작품</span>
        <span class="tag">Dynamic</span>
      </div>
      <div class="preview">
        <!-- 아래 링크는 실제 과제 4 Fullscreen 링크로 바꿔야 함 -->
        <iframe src="project4/index.html"></iframe>
      </div>
    </section>

    <!-- 2행 왼쪽: 과제 2 -->
    <section class="card">
      <div class="card-title">
        <span>과제 2 | 작품</span>
        <span class="tag">Static</span>
      </div>
      <div class="preview">
        <iframe src="project2/index.html"></iframe>>
      </div>
    </section>

    <!-- 2행 오른쪽: 과제 3 -->
    <section class="card">
      <div class="card-title">
        <span>과제 3 | 애니메이션 추상화</span>
        <span class="tag">Animation</span>
      </div>
      <div class="preview">
        <!-- 과제 3 링크가 다르면 여기만 실제 Fullscreen 링크로 바꾸면 됨 -->
        <iframe src="project3/index.html"></iframe>
      </div>
    </section>
  </main>

  <footer>
    각 작품은 iframe을 활용하여 별도의 클릭 없이 페이지 접속 시 바로 확인할 수 있도록 구성했습니다.
  </footer>

  <script>
    function resizeFrames() {
      const previews = document.querySelectorAll(".preview");

      previews.forEach(function(preview) {
        const iframe = preview.querySelector("iframe");
        const scale = preview.clientWidth / 600;
        iframe.style.transform = "scale(" + scale + ")";
      });
    }

    window.addEventListener("load", resizeFrames);
    window.addEventListener("resize", resizeFrames);
  </script>
</body>
</html>
