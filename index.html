<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 작품 포트폴리오</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>나의 p5.js 작품 포트폴리오</h1>
    <p class="intro">
      과제 1부터 과제 4까지의 p5.js 작품을 2행 2열 구조로 배치했습니다.<br />
      정적 작품과 동적 작품이 한 화면에서 바로 보이도록 구성했습니다.
    </p>
  </header>

  <main id="projects">
    <section class="card">
      <div class="card-title">
        <span>과제 1 | 추상화</span>
        <span class="tag">Static</span>
      </div>
      <div class="preview">
        <iframe src="project1/index.html"></iframe>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <span>과제 4 | 작품</span>
        <span class="tag">Project 4</span>
      </div>
      <div class="preview">
        <iframe src="project4/index.html"></iframe>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <span>과제 2 | 작품</span>
        <span class="tag">Project 2</span>
      </div>
      <div class="preview">
        <iframe src="project2/index.html"></iframe>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <span>과제 3 | 애니메이션 추상화</span>
        <span class="tag">Animation</span>
      </div>
      <div class="preview">
        <iframe src="project3/index.html"></iframe>
      </div>
    </section>
  </main>

  <footer>
    각 작품은 iframe을 활용하여 별도의 클릭 없이 페이지 접속 시 바로 확인할 수 있도록 구성했습니다.
  </footer>

  <script>
    function resizeFrames() {
      const previews = document.querySelectorAll(".preview");

      previews.forEach(function(preview) {
        const iframe = preview.querySelector("iframe");
        const scale = preview.clientWidth / 600;
        iframe.style.transform = "scale(" + scale + ")";
      });
    }

    window.addEventListener("load", resizeFrames);
    window.addEventListener("resize", resizeFrames);
  </script>
</body>
</html>
